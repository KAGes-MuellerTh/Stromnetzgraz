name: Release

# Creates the release (and its tag) for the version in manifest.json, if it
# does not exist yet. HACS needs releases; without them it installs by commit
# hash and fails with a 404.

on:
  push:
    branches:
      - master
    paths:
      - custom_components/stromnetzgraz/manifest.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v5"
      - name: Create release for manifest version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(jq -r .version custom_components/stromnetzgraz/manifest.json)"
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists"
            exit 0
          fi
          gh release create "${tag}" --target "${GITHUB_SHA}" --title "${tag}" --generate-notes
